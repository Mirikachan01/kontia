<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --amber:#eaa800;      /* tono principal del logo */
    --amber-2:#efb62b;
    --amber-3:#f9ce62;
    --amber-4:#fad87e;
    --ink:#fffcfc;
    --ink-soft:rgba(255, 255, 255, 0.825);
    --glass-edge:rgba(255,226,150,.38);
    --deep:#150f05;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--deep);overflow:hidden}

  /* ============ FONDO ============ */
  .scene{position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,#1b1306 0%,#3b2807 48%,#8a5a06 82%,#e0a010 100%)}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
  .glow.a{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,rgba(250,216,126,.55),transparent 65%)}
  .glow.b{width:40vmax;height:40vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,rgba(234,168,0,.6),transparent 65%);animation-delay:-6s}
  @keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}
  .sun{position:absolute;left:50%;top:44%;width:min(30vw,300px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 40%,#fffbe9 0,#fad87e 45%,#eaa800 100%);
    box-shadow:0 0 100px 34px rgba(250,200,80,.35)}
  .scene svg{position:absolute;left:0;bottom:0;width:100%;height:60%}
  .m1{fill:var(--amber-4);opacity:.35}
  .m2{fill:var(--amber-3);opacity:.5}
  .m3{fill:var(--amber-2);opacity:.75}
  .m4{fill:#1a1206}

  /* ============ PREPANTALLA ============ */
  .preloader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
    background:radial-gradient(circle at 50% 45%,#2b1d06 0,#100a03 72%);
    transition:opacity 1s ease,visibility 1s ease,transform 1.1s cubic-bezier(.7,0,.2,1)}
  .preloader.done{opacity:0;visibility:hidden;transform:scale(1.06)}
  .pl-logo{position:relative;width:110px;height:110px;display:grid;place-items:center}
  .pl-logo img{width:70px;height:70px;animation:breathe 2.2s ease-in-out infinite}
  .pl-logo::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:3px solid rgba(250,216,126,.18);border-top-color:var(--amber);animation:spin 1.4s cubic-bezier(.5,.1,.5,.9) infinite}
  .pl-logo::after{content:"";position:absolute;inset:12px;border-radius:50%;
    border:2px solid transparent;border-bottom-color:var(--amber-4);animation:spin 2s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{transform:scale(.9);opacity:.85}}
  .bar{width:min(240px,60vw);height:4px;border-radius:4px;background:rgba(255,226,150,.16);overflow:hidden}
  .bar b{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--amber),var(--amber-4));transition:width .25s ease-out}
  .pre-text{font-size:14px;color:var(--ink-soft);letter-spacing:.3px}

  /* ============ TARJETA ============ */
  .stage{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:min(410px,100%);padding:36px 32px 30px;border-radius:28px;
    background:linear-gradient(150deg,rgba(255,240,200,.24),rgba(255,240,200,.07));
    border:1px solid var(--glass-edge);
    box-shadow:0 30px 70px rgba(10,6,0,.6),inset 0 1px 0 rgba(255,245,210,.5);
    backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
    opacity:0;transform:translateY(24px) scale(.97);
    transition:opacity .9s ease .35s,transform .9s cubic-bezier(.2,.9,.3,1) .35s}
  body.ready .card{opacity:1;transform:none}
  .logo{display:block;width:76px;height:76px;margin:0 auto 16px;filter:drop-shadow(0 8px 18px rgba(234,168,0,.45))}
  h1{margin:0 0 6px;text-align:center;font-size:23px;font-weight:650}
  .sub{margin:0 0 26px;text-align:center;font-size:14px;color:var(--ink-soft)}

  .field{position:relative;margin-bottom:14px}
  .field input{width:100%;padding:15px 48px 15px 16px;border-radius:14px;font:inherit;font-size:15.5px;color:#f5f1f1;
    background:rgba(255,245,215,.1);border:1px solid rgba(255,226,150,.32);outline:none;
    transition:border-color .2s,background .2s,box-shadow .2s}
  .field input::placeholder{color:rgba(255,245,215,.55)}
  .field input:focus{border-color:var(--amber-3);background:rgba(255,245,215,.16);box-shadow:0 0 0 4px rgba(234,168,0,.28)}
  .field.error input{border-color:#ff8a7a;box-shadow:0 0 0 4px rgba(255,90,70,.22)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;
    background:transparent;color:rgba(255,245,215,.85);cursor:pointer;display:grid;place-items:center}
  .eye:hover{background:rgba(255,245,215,.14)}
  .eye:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .msg{min-height:20px;margin:0 0 12px;font-size:13.5px;color:#ffc2b8;text-align:center}
  .btn{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,240,190,.55);font:inherit;font-size:15.5px;font-weight:700;
    color:#2a1b00;cursor:pointer;background:linear-gradient(135deg,var(--amber-3),var(--amber));
    box-shadow:0 8px 22px rgba(234,168,0,.35);transition:transform .15s,filter .15s,opacity .2s}
  .btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

  body.leaving .card{opacity:0;transform:translateY(-16px) scale(.97);transition:opacity .6s ease,transform .6s ease}
  .veil{position:fixed;inset:0;z-index:60;background:#100a03;opacity:0;pointer-events:none;transition:opacity .7s ease .3s}
  body.leaving .veil{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .glow,.pl-logo img,.pl-logo::before,.pl-logo::after{animation:none}
    .preloader,.card,.veil{transition-duration:.01s;transition-delay:0s}
  }
</style>
</head>
<body>

  <!-- Prepantalla de carga -->
  <div class="preloader" id="pre" aria-live="polite">
    <div class="pl-logo"><img src="logo.png" alt=""></div>
    <div class="bar"><b id="barFill"></b></div>
    <div class="pre-text" id="preText">Preparando tu espacio…</div>
  </div>

  <!-- Fondo -->
  <div class="scene" aria-hidden="true">
    <div class="glow a"></div><div class="glow b"></div>
    <div class="sun"></div>
    <svg viewBox="0 0 1440 600" preserveAspectRatio="none">
      <path class="m1" d="M0 330 L170 210 L300 300 L470 170 L640 310 L800 220 L980 330 L1160 200 L1320 290 L1440 240 L1440 600 L0 600Z"/>
      <path class="m2" d="M0 400 L140 320 L290 390 L450 300 L620 400 L790 330 L960 410 L1130 320 L1290 400 L1440 350 L1440 600 L0 600Z"/>
      <path class="m3" d="M0 470 L180 410 L340 470 L520 400 L700 480 L880 420 L1060 485 L1240 420 L1440 470 L1440 600 L0 600Z"/>
      <path class="m4" d="M0 540 Q360 490 720 535 T1440 520 L1440 600 L0 600Z"/>
    </svg>
  </div>

  <!-- Acceso -->
  <main class="stage">
    <form class="card" id="form" autocomplete="off" novalidate>
      <img class="logo" src="logo.png" alt="Logo">
      <h1>Bienvenido</h1>
      <p class="sub">Ingresa tu contraseña para continuar</p>

      <div class="field" id="field">
        <input type="password" id="pass" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
        <button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <p class="msg" id="msg" role="alert"></p>
      <button class="btn" id="go" type="submit">Entrar</button>
    </form>
  </main>

  <div class="veil"></div>

<script>
/* =====================================================
   CONFIGURACIÓN — se edita solo desde este archivo
   =====================================================
   PASSWORD_HASH es el SHA-256 de la contraseña (no el texto).

   CÓMO CAMBIAR LA CONTRASEÑA
   1) Abre la consola del navegador (F12 → pestaña Consola).
   2) Pega esto, cambiando NuevaClave por tu nueva contraseña, y pulsa Enter:
        crypto.subtle.digest('SHA-256',new TextEncoder().encode('NuevaClave'))
          .then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
   3) Copia el texto largo que aparece y pégalo en PASSWORD_HASH (entre comillas).
   4) Guarda el archivo y recarga la página.
   (En Linux/Mac también sirve:  printf '%s' 'NuevaClave' | sha256sum)
   Distingue mayúsculas y minúsculas: 'PREDATOR1a' ≠ 'predator1a'. */
var CONFIG = {
  PASSWORD_HASH: 'a0751b390bf56e672f07ae8787f449c37454405a436992c3815d33ffc4b24f21',
  REDIRECT: '../html/index1.html',    // página a la que se entra al acceder
  SESSION_KEY: '__app_auth',  // marca de sesión (se borra al cerrar la pestaña)
  MAX_ATTEMPTS: 5,            // intentos antes del bloqueo temporal
  LOCK_SECONDS: 30
};

(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pre = $('pre'), fill = $('barFill'), preText = $('preText');
  var form = $('form'), pass = $('pass'), msg = $('msg'), go = $('go'), field = $('field'), eye = $('eye');

  /* Si ya hay sesión activa, entra directo */
  try { if (sessionStorage.getItem(CONFIG.SESSION_KEY) === '1') { location.replace(CONFIG.REDIRECT); return; } } catch (e) {}

  /* ---------- Prepantalla de carga ---------- */
  var steps = [
    [18, 'Preparando tu espacio…'],
    [46, 'Cargando recursos…'],
    [74, 'Verificando seguridad…'],
    [100, 'Todo listo']
  ];
  var i = 0;
  (function next() {
    if (i >= steps.length) {
      setTimeout(function () {
        pre.classList.add('done');
        document.body.classList.add('ready');
        setTimeout(function () { pass.focus(); }, 900);
      }, 450);
      return;
    }
    fill.style.width = steps[i][0] + '%';
    preText.textContent = steps[i][1];
    i++;
    setTimeout(next, 520 + Math.random() * 280);
  })();

  /* ---------- Utilidades ---------- */
  function sha256(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    });
  }

  function fail(text) {
    msg.textContent = text;
    field.classList.add('error');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    pass.select();
  }

  /* ---------- Bloqueo por intentos (persistente) ---------- */
  var LOCK_KEY = '__app_lock';
  function lockedUntil() { try { return +localStorage.getItem(LOCK_KEY) || 0; } catch (e) { return 0; } }
  var attempts = 0, lockTimer = null;

  function startLock(until) {
    go.disabled = true; pass.disabled = true;
    clearInterval(lockTimer);
    lockTimer = setInterval(function () {
      var left = Math.ceil((until - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(lockTimer); go.disabled = false; pass.disabled = false;
        msg.textContent = ''; field.classList.remove('error'); attempts = 0; pass.focus();
      } else {
        msg.textContent = 'Demasiados intentos. Espera ' + left + ' s.';
      }
    }, 250);
  }
  if (lockedUntil() > Date.now()) startLock(lockedUntil());

  /* ---------- Enviar ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (go.disabled) return;
    var value = pass.value;
    if (!value) { fail('Escribe tu contraseña.'); return; }
    go.disabled = true;

    if (!(window.crypto && crypto.subtle)) {
      go.disabled = false;
      fail('Abre la página desde localhost o https para validar la contraseña.');
      return;
    }

    sha256(value).then(function (h) {
      if (h === CONFIG.PASSWORD_HASH) {
        try { sessionStorage.setItem(CONFIG.SESSION_KEY, '1'); localStorage.removeItem(LOCK_KEY); } catch (e) {}
        msg.textContent = ''; field.classList.remove('error');
        document.body.classList.add('leaving');
        setTimeout(function () { location.href = CONFIG.REDIRECT; }, 1000);
      } else {
        attempts++;
        go.disabled = false;
        if (attempts >= CONFIG.MAX_ATTEMPTS) {
          var until = Date.now() + CONFIG.LOCK_SECONDS * 1000;
          try { localStorage.setItem(LOCK_KEY, String(until)); } catch (e) {}
          fail('Contraseña incorrecta.');
          startLock(until);
        } else {
          fail('Contraseña incorrecta. Intentos restantes: ' + (CONFIG.MAX_ATTEMPTS - attempts));
        }
        pass.value = '';
      }
    });
  });

  pass.addEventListener('input', function () { field.classList.remove('error'); msg.textContent = ''; });

  /* ---------- Mostrar / ocultar ---------- */
  eye.addEventListener('click', function () {
    var show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    pass.focus();
  });
})();
</script>
</body>
</html>
