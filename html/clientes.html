<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Clientes · Panel de clientes</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/config.js"></script>
  <script src="../js/sheets.js" defer></script>
  <link rel="stylesheet" href="../css/cuentas.css"><!-- botones, ventanas flotantes, formularios y avisos -->
  <link rel="stylesheet" href="../css/clientes.css">
  <script src="../js/clientes.js" defer></script>
   <link rel="icon" type="image/png" href="../logo.png">
</head>
<body>

  <!-- Iconos (sprite SVG) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14 9.5l2.5 2.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4-.9"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.7-1.7"/></symbol>
    </defs>
  </svg>

  <div class="app">

    <!-- Menú lateral (en móvil pasa a barra inferior) -->
    <nav class="sidebar glass" aria-label="Navegación principal">
      <ul>
        <li><a href="index1.html" class="nav-link" data-label="Dashboard"><svg class="icon" aria-hidden="true"><use href="#i-dashboard"/></svg><span class="sr-only">Dashboard</span></a></li>
        <li><a href="clientes.html" class="nav-link is-active" aria-current="page" data-label="Clientes"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span class="sr-only">Clientes</span></a></li>
        <li><a href="cuentas.html" class="nav-link" data-label="Cuentas"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg><span class="sr-only">Cuentas</span></a></li>
        <li><a href="vencimientos.html" class="nav-link" data-label="Vencimientos"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span class="sr-only">Vencimientos</span></a></li>
        <li><a href="tarjetas.html" class="nav-link" data-label="Tarjetas"><svg class="icon" aria-hidden="true"><use href="#i-card"/></svg><span class="sr-only">Tarjetas</span></a></li>
        <li><a href="accesos.html" class="nav-link" data-label="Accesos directos"><svg class="icon" aria-hidden="true"><use href="#i-link"/></svg><span class="sr-only">Accesos directos</span></a></li>
        <li class="push"><a href="ajustes.html" class="nav-link" data-label="Ajustes"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span class="sr-only">Ajustes</span></a></li>
      </ul>
    </nav>

    <main class="main">

      <header class="topbar">
        <div>
          <h1>Clientes</h1>
          <p class="date is-plain">Controla quién tiene servicio y cuándo vence</p>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btn-add-client">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
            Añadir cliente
          </button>
        </div>
      </header>

      <!-- Contadores por estado (también sirven de filtro) -->
      <section class="stats" aria-label="Clientes por estado">
        <button type="button" class="card glass stat" data-estado="activo" style="--tone: var(--ok)" aria-pressed="false">
          <span class="label"><i class="stat-dot"></i>Clientes activos</span>
          <span class="big" id="n-activo">0</span>
          <span class="sub" id="sub-activo">Con más de 7 días de servicio</span>
        </button>
        <button type="button" class="card glass stat" data-estado="porvencer" style="--tone: var(--warn)" aria-pressed="false">
          <span class="label"><i class="stat-dot"></i>Por vencer</span>
          <span class="big" id="n-porvencer">0</span>
          <span class="sub" id="sub-porvencer">Vencen en 7 días o menos</span>
        </button>
        <button type="button" class="card glass stat" data-estado="vencido" style="--tone: var(--danger)" aria-pressed="false">
          <span class="label"><i class="stat-dot"></i>Vencidos</span>
          <span class="big" id="n-vencido">0</span>
          <span class="sub">Servicio ya vencido</span>
        </button>
      </section>

      <!-- Lista, buscador y filtros -->
      <section class="card glass" aria-labelledby="lista-title">
        <div class="card-head">
          <h2 id="lista-title">Lista de clientes</h2>
          <span class="chip" id="count-clientes">0 clientes</span>
        </div>

        <div class="toolbar">
          <div class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <label for="buscar" class="sr-only">Buscar por nombre o número</label>
            <input id="buscar" type="search" placeholder="Buscar por nombre o número" autocomplete="off">
          </div>
          <div class="filters" role="group" aria-label="Filtrar por estado">
            <button type="button" class="filter" data-filtro="todos" aria-pressed="true">Todos <span class="count" id="cnt-todos">0</span></button>
            <button type="button" class="filter" data-filtro="activo" aria-pressed="false">Activos <span class="count" id="cnt-activo">0</span></button>
            <button type="button" class="filter" data-filtro="porvencer" aria-pressed="false">Por vencer <span class="count" id="cnt-porvencer">0</span></button>
            <button type="button" class="filter" data-filtro="vencido" aria-pressed="false">Vencidos <span class="count" id="cnt-vencido">0</span></button>
          </div>
        </div>

        <ul class="clients" id="lista-clientes"></ul>
      </section>

    </main>
  </div>

  <!-- ===== Ventana: añadir / editar cliente ===== -->
  <dialog class="modal modal-wide" id="dlg-client" aria-labelledby="dlg-client-title">
    <div class="modal-body">
      <div class="modal-head">
        <h2 id="dlg-client-title">Añadir cliente</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>

      <form id="form-client" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="f-id">ID</label>
            <input id="f-id" type="text" readonly tabindex="-1">
          </div>
          <div class="field">
            <label for="f-nombre">Nombre</label>
            <input id="f-nombre" type="text" maxlength="60" autocomplete="off" placeholder="Ej: Carlos Rojas" required>
          </div>

          <div class="field">
            <label for="f-usuario">Usuario</label>
            <input id="f-usuario" type="text" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="f-password">Contraseña</label>
            <div class="input-group">
              <input id="f-password" type="password" maxlength="80" autocomplete="off" spellcheck="false" required>
              <button type="button" class="icon-btn" id="toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
            </div>
          </div>

          <div class="field">
            <label for="f-whatsapp">Número de WhatsApp</label>
            <input id="f-whatsapp" type="tel" inputmode="tel" maxlength="20" autocomplete="off" placeholder="Ej: 71234567" required>
          </div>
          <div class="field">
            <label for="f-dispositivos">Dispositivos</label>
            <select id="f-dispositivos">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="10">10</option>
            </select>
          </div>

          <div class="field span-2">
            <label id="f-cuentas-label">Cuentas</label>
            <div class="cuentas-pick" id="f-cuentas" role="group" aria-labelledby="f-cuentas-label"></div>
            <p class="hint" id="f-cuentas-hint"></p>
          </div>

          <div class="field">
            <label for="f-inicio">Fecha de inicio</label>
            <input id="f-inicio" type="date" required>
          </div>
          <div class="field">
            <label for="f-duracion">Duración</label>
            <select id="f-duracion">
              <option value="1">1 mes</option>
              <option value="2">2 meses</option>
              <option value="3">3 meses</option>
              <option value="12">1 año</option>
            </select>
          </div>
          <p class="hint span-2" id="f-vence-hint"></p>

          <div class="field">
            <label for="f-compra">Precio de compra (<span data-moneda>Bs</span>)</label>
            <input id="f-compra" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="f-venta">Precio de venta (<span data-moneda>Bs</span>)</label>
            <input id="f-venta" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" required>
          </div>
          <p class="hint span-2" id="f-ganancia"></p>
        </div>

        <p class="form-error" id="client-error" role="alert"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
          <button type="submit" class="btn btn-primary" id="client-submit">Guardar cliente</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- ===== Ventana: confirmar eliminación ===== -->
  <dialog class="modal" id="dlg-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <div class="modal-body">
      <div class="modal-head">
        <h2 id="confirm-title">¿Eliminar?</h2>
      </div>
      <p class="modal-text" id="confirm-msg"></p>
      <form method="dialog" class="modal-actions">
        <button type="submit" class="btn btn-ghost" value="cancel" autofocus>Cancelar</button>
        <button type="submit" class="btn btn-danger" value="ok" id="confirm-ok">Eliminar</button>
      </form>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

</body>
</html>
